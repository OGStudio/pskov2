<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="ace-1.43.3.min.noconflict.js"></script>
    <script src="kotlin-kotlin-stdlib.js"></script>
    <script src="kotlin_org_jetbrains_kotlin_kotlin_dom_api_compat.js"></script>
    <script src="showdown-2.0.0.min.js"></script>
    <script src="uikit-3.23.11.min.js"></script>
    <script src="uikit-icons-3.23.11.min.js"></script>
    <script src="pskov-ver-browser.js"></script>
    <script>
        let KT = window["pskov:ver-browser"].org.opengamestudio;
        window.components = [];
    </script>
    <link rel="stylesheet" href="css/uikit-3.23.11.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <title>PSKOV 2</title>
  </head>
  <body>
    <!-- SPLASH -->
    <div id="splash" class="center-contents-vertically">
      <div class="uk-animation-fade uk-animation-reverse">
        <img class="uk-align-center uk-animation-stroke" src="img/pskov_out_1.svg" width="200" height="200" uk-svg="stroke-animation: true">
      </div>
    </div>

    <!-- HEADER -->
    <div class="uk-padding-small uk-padding-remove-horizontal uk-padding-remove-bottom">
      <div class="uk-container">
        <strong id="headerKey">TODO-Header-key</strong><strong>:</strong>
        <span id="headerValue">TODO-Header-value</span>
        <button class='uk-button uk-button-default uk-button-small uk-align-right' onclick='appCtrl().set("didClickSaveBtn", true)'>
          <img src="img/diskette.svg" width="20" height="20">
        </button>
      </div>
    </div>

    <!-- TABS -->
    <div class="uk-container">
      <ul uk-tab>
        <li id="tabFiles" onclick='appCtrl().set("didClickFilesTab", true)'><a><span uk-icon="album"></span>Files</a></li>
        <li id="tabEditor" onclick='appCtrl().set("didClickEditorTab", true)'><a><span uk-icon="file-edit"></span>Editor</a></li>
        <li id="tabRender" onclick='appCtrl().set("didClickRenderTab", true)'><a><span uk-icon="desktop"></span>Render</a></li>
      </ul>
    </div>

    <!-- TAB: FILES -->
    <div id="files" class="uk-container uk-padding" hidden>
      <ul id="filesContents" class="uk-accordion" uk-accordion>
      </ul>
    </div>



    <a class="uk-button uk-button-default" href="#filesCopy" uk-toggle>tmp open</a>

    <!-- FILES' MODALS -->
    <div id="filesCopy" uk-modal>
      <div class="uk-modal-dialog">
        <div class="uk-modal-header">
          <h2 class="uk-modal-title">Make a copy</h2>
        </div>
        <div class="uk-modal-body">
          <input id="filesCopyInput" class="uk-input" type="text" oninput='appCtrl().set("inputFilesCopy", this.value);'>
        </div>
        <div class="uk-modal-footer uk-text-right">
          <button class="uk-button uk-button-default uk-modal-close" type="button">Cancel</button>
          <button class="uk-button uk-button-primary" type="button">OK</button>
        </div>
      </div>
    </div>

    <!-- TAB: EDITOR -->
    <div id="editor" class="uk-container" hidden>
      <div id="editorContents">TODO-Editor</div>
    </div>

    <!-- TAB: RENDER -->
    <div id="render" class="uk-container" hidden>
      <iframe id="renderContents"></iframe>
    </div>

    <!-- FOOTER -->
    <div id="footer" class="uk-padding" hidden>
      <div class="uk-container">
        <img src="img/pskov_out_1.svg" width="70" height="70" uk-svg>
        <strong>Version:</strong>
        <span id="footer-version">TODO-Version</span>
      </div>
    </div>

    <script src="other.js"></script>
    <script src="app.js"></script>
  </body>
</html>
