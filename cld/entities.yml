version: 1

kotlin: package org.opengamestudio
kotlin: import kotlin.js.JsExport

AppContext:
    prefix-kotlin: @JsExport
    type: context
    fields:
        baseURL: String
        cfg: [String: String]
        didClickEditorTab: Bool
        didClickFilesTab: Bool
        didClickRenderTab: Bool
        didClickSaveBtn: Bool
        didLaunch: Bool
        didResize: Bool
        didSaveEditedFiles: Bool
        didSaveFile: Bool
        editedContents: String
        editedFileContents: [String: String]
        editorContents: String
        header: [String]
        inputDirFiles: [Int: [FSFile]]
        inputDirs: [String]
        inputMDFiles: [Int: [String]]
        installEditor: Bool
        installMDConverter: Bool
        itemContents: String
        itemDate: String
        itemSlug: String
        itemTemplates: [Int: String]
        itemTitle: String
        itemURL: String
        listInputDirId: Int
        projectPath: String
        readFile: String
        readFileContents: String
        rendererContents: String
        request: NetRequest
        resizeEditor: Bool
        resizeRenderer: Bool
        response: NetResponse
        responseError: NetResponse
        saveFileId: Int
        saveFiles: [String]
        selectedFileId: [Int]
        selectedFileName: String
        selectedTabId: Int
        splashTimeout: Int

FSFile:
    prefix-kotlin: @JsExport
    type: struct
    fields:
        isFile: Bool
        path: String

NetRequest:
    prefix-kotlin: @JsExport
    type: struct
    fields:
        body: String
        method: String
        url: String

NetResponse:
    prefix-kotlin: @JsExport
    type: struct
    fields:
        contents: String
        req: NetRequest

SrvContext:
    prefix-kotlin: @JsExport
    type: context
    fields:
        arguments: [String]
        browserDir: String
        defaultBrowserDir: String
        defaultHTTPPort: Int
        didLaunch: Bool
        didWriteFile: Bool
        dirFiles: [FSFile]
        httpPort: Int
        inputDir: String
        inputHTTPPort: Int
        listDir: String
        projectAbsPath: String
        projectDir: String
        readFile: String
        readFileContents: String
        request: NetRequest
        response: NetResponse
        url: String
        writeFile: [String]
