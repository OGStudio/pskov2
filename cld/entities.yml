version: 1

kotlin: package org.opengamestudio
kotlin: import kotlin.js.JsExport

AppContext:
    prefix-kotlin: @JsExport
    type: context
    fields:
        baseURL: String
        cfg: [String: String]
        converterInput: String
        converterOutput: String
        copyFileId: [Int]
        deleteFile: String
        deleteFileId: [Int]
        deleteFileOrigin: String
        didClickEditorTab: Bool
        didClickFilesCopyOK: Bool
        didClickFilesDeleteOK: Bool
        didClickFilesRenameOK: Bool
        didClickFilesTab: Bool
        didClickRenderTab: Bool
        didClickSaveBtn: Bool
        didCopyFile: Bool
        didCopyRenamedFile: Bool
        didDeleteFile: Bool
        didLaunch: Bool
        didRenameFile: Bool
        didResize: Bool
        didSaveEditedFiles: Bool
        didSaveFile: Bool
        didSaveRenderedFile: Bool
        editedContents: String
        editedFileContents: [String: String]
        editorContents: String
        filesCopyDefaultName: String
        filesDeleteName: String
        filesRenameName: String
        header: [String]
        hideFileOptions: [Int]
        inputDirFiles: [Int: [FSFile]]
        inputDirs: [String]
        inputFilesCopy: String
        inputFilesRename: String
        inputMDFiles: [Int: [String]]
        installEditor: Bool
        installMDConverter: Bool
        isFilesCopyDialogVisible: Bool
        isFilesDeleteDialogVisible: Bool
        isFilesRenameDialogVisible: Bool
        itemTemplates: [Int: String]
        listInputDirId: Int
        page: Page
        projectPath: String
        readFile: String
        readFileContents: String
        readFileOrigin: String
        renameFileId: [Int]
        renderedFile: String
        renderPage: String
        request: NetRequest
        resizeEditor: Bool
        resizeRenderer: Bool
        response: NetResponse
        responseError: NetResponse
        saveFileId: Int
        saveFiles: [String]
        selectedFileId: [Int]
        selectedFileName: String
        selectedTabId: Int
        splashTimeout: Int

FSFile:
    prefix-kotlin: @JsExport
    type: struct
    fields:
        isFile: Bool
        path: String

NetRequest:
    prefix-kotlin: @JsExport
    type: struct
    fields:
        body: String
        method: String
        url: String

NetResponse:
    prefix-kotlin: @JsExport
    type: struct
    fields:
        contents: String
        req: NetRequest

Page:
    prefix-kotlin: @JsExport
    type: struct
    fields:
        contents: String
        date: String
        slug: String
        title: String

PlayContext:
    type: context
    fields:
        didLaunch: Bool
        didResetWebView: Bool
        isPlaygroundVisible: Bool
        url: String

SrvContext:
    prefix-kotlin: @JsExport
    type: context
    fields:
        arguments: [String]
        browserDir: String
        defaultBrowserDir: String
        defaultHTTPPort: Int
        deleteFile: String
        didDeleteFile: Bool
        didLaunch: Bool
        didWriteFile: Bool
        dirFiles: [FSFile]
        httpPort: Int
        inputDir: String
        inputHTTPPort: Int
        listDir: String
        projectAbsPath: String
        projectDir: String
        readFile: String
        readFileContents: String
        request: NetRequest
        response: NetResponse
        url: String
        writeFile: [String]
